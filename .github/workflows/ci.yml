name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            rails: "7.2"
          - ruby: "3.2"
            rails: "8.0"
          - ruby: "3.3"
            rails: "8.1"
          - ruby: "3.4"
            rails: "8.1"
          - ruby: "4.0"
            rails: "8.1"

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  test-postgresql:
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: "8.1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sent_emails_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests against PostgreSQL
        env:
          DB: postgresql
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: "8.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run StandardRB
        run: bundle exec standardrb

  build:
    runs-on: ubuntu-latest

    env:
      RAILS_VERSION: "8.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build sent_emails.gemspec

      - name: Verify gem
        run: |
          gem install sent_emails-*.gem
          ruby -e "require 'rails'; require 'sent_emails'; puts SentEmails::VERSION"
